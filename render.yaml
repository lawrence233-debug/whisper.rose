services:
  - type: web
    name: whisper-rose
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whisper-rose-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: whisper-rose-db
    databaseName: whisper_rose
    user: whisper_rose_user
    plan: free
